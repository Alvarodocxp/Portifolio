  <text x="92" y="215" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="700" fill="#252a32">Aprender. Aplicar. Evoluir.</text>
  <text x="92" y="286" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#4e545d">Minha trajetória é construída entre a formação acadêmica e projetos pessoais. Estou em</text>
  <text x="92" y="312" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#4e545d">busca da primeira oportunidade profissional em desenvolvimento.</text>
