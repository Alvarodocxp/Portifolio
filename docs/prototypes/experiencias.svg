  <text x="174" y="610.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#4e545d">Graduação com foco em desenvolvimento web, arquitetura de software, programação orientada a objetos e boas práticas de engenharia.</text>
